# A merged pull request lands on main as a push, so this one trigger
# covers both a direct push and a PR merge without publishing twice.
name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-save

      - name: Unit & Pipeline Tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify All Sample Atlases
        run: npm run verify:samples

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if published=$(npm view "${name}@${version}" version 2>/dev/null); then
            echo "${name}@${published} is already on npm. Skipping."
            exit 0
          fi
          npm publish --access public --provenance
