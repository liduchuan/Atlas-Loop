  gap: 8px;
  flex-shrink: 0;
}
.atlas-model-pill {
  font-size: 12px;
  font-weight: 600;
  color: #1e293b;
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  padding: 5px 10px;
  border-radius: 8px;
}
.atlas-scope-btn {
  font-size: 12px;
  font-weight: 600;
  color: #b45309;
  background: #fef3c7;
  border: 1px solid #fde68a;
  padding: 5px 10px;
  border-radius: 8px;
  cursor: pointer;
}
.atlas-toolbar-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 20px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.atlas-streams-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.atlas-stream-pill-group {
  display: inline-flex;
  align-items: center;
}
.atlas-stream-pill {
  font-size: 12.5px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 999px;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #334155;
  cursor: pointer;
}
.atlas-stream-pill.active {
  background: #0f172a;
  color: #ffffff;
  border-color: #0f172a;
}
.atlas-stream-help-btn {
  margin-left: -4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid #93c5fd;
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}
.atlas-controls-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.atlas-search-box {
  position: relative;
}
.atlas-search-input {
  width: 250px;
  padding: 6px 10px;
  font-size: 12.5px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: #ffffff;
  outline: none;
}
.atlas-search-input:focus { border-color: #2563eb; }
.atlas-search-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 320px;
  max-height: 300px;
  overflow-y: auto;
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.14);
  z-index: 50;
  padding: 4px;
}
.atlas-search-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 7px 9px;
  border: none;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
}
.atlas-search-item:hover { background: #f1f5f9; }
.atlas-search-item-title {
  font-size: 12.5px;
  font-weight: 600;
  color: #0f172a;
  display: flex;
  align-items: center;
  gap: 6px;
}
.atlas-search-item-sub {
  font-size: 11.5px;
  color: #64748b;
  margin-top: 2px;
}
.atlas-search-empty {
  padding: 10px;
  font-size: 12px;
  color: #64748b;
}
.atlas-canvas-btns {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.atlas-ctrl-btn {
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  background: #ffffff;
  color: #1e293b;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  cursor: pointer;
}
.atlas-ctrl-btn:hover { background: #f1f5f9; }
.atlas-ctrl-btn.locked {
  background: #fef2f2;
  color: #b91c1c;
  border-color: #fca5a5;
}
.atlas-ctrl-btn.active {
  background: #e0f2fe;
  border-color: #7dd3fc;
  color: #0369a1;
}
.atlas-ctrl-btn.reset-btn {
  background: #f8fafc;
  border-color: #94a3b8;
}
.atlas-reading-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 20px;
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  overflow-x: auto;
  flex-shrink: 0;
}
.atlas-reading-label {
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  white-space: nowrap;
}
.atlas-reading-steps {
  display: flex;
  align-items: center;
  gap: 6px;
}
.atlas-step-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid #e2e8f0;
  background: #f8fafc;
  color: #334155;
  cursor: pointer;
  white-space: nowrap;
}
.atlas-step-chip.active {
  border-color: #2563eb;
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: 600;
}
.atlas-step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #cbd5e1;
  color: #0f172a;
  font-size: 10.5px;
  font-weight: 700;
}
.atlas-main-workspace {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
  width: 100%;
}
.atlas-canvas-container {
  flex: 1;
  height: 100%;
  min-height: 400px;
  position: relative;
}
.atlas-node {
  border: 1px solid #cbd5e1;
  border-radius: 11px;
  padding: 10px 12px;
  box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  position: relative;
}
.atlas-node-sub {
  border-style: dashed;
}
.atlas-node-selected {
  outline: 2.5px solid #2563eb;
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.18);
}
.atlas-handle {
  width: 8px !important;
  height: 8px !important;
  background: #64748b !important;
}
.atlas-node-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}
.atlas-node-badges {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.atlas-role-badge {
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 5px;
}
.atlas-sub-pill {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  background: #e0f2fe;
  color: #0369a1;
}
.atlas-unverified-pill {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  background: #fef3c7;
  color: #b45309;
  border: 1px dashed #f59e0b;
}
.atlas-help-wrap {
  position: relative;
  flex-shrink: 0;
}
.atlas-help-btn {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid #2563eb;
  background: #eff6ff;
  color: #1d4ed8;
  font-size: 12.5px;
  font-weight: 800;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.atlas-help-btn:hover {
  background: #2563eb;
  color: #ffffff;
}
.atlas-help-tooltip {
  position: absolute;
  bottom: calc(100% + 8px);
  right: 0;
  width: 230px;
  padding: 7px 9px;
  background: #0f172a;
  color: #f8fafc;
  font-size: 11.5px;
  line-height: 1.4;
  border-radius: 8px;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
  z-index: 100;
  pointer-events: none;
}
.atlas-node-title {
  font-size: 13.5px;
  font-weight: 700;
  color: #0f172a;
  line-height: 1.35;
}
.atlas-node-summary {
  font-size: 11.5px;
  color: #475569;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.atlas-node-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 2px;
  padding-top: 5px;
  border-top: 1px solid rgba(148, 163, 184, 0.25);
}
.atlas-expand-btn {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 5px;
  border: 1px solid #94a3b8;
  background: #ffffff;
  color: #1e293b;
  cursor: pointer;
}
.atlas-expand-btn.active {
  background: #0ea5e9;
  border-color: #0ea5e9;
  color: #ffffff;
}
.atlas-anchor-count {
  font-size: 10.5px;
  font-weight: 600;
  color: #64748b;
}
.atlas-legend-card {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.atlas-legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #1e293b;
}
.atlas-legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}
.atlas-inspector {
  width: 390px;
  max-width: 44vw;
  height: 100%;
  overflow-y: auto;
  background: #ffffff;
  border-left: 1px solid #e2e8f0;
  padding: 16px 18px;
  flex-shrink: 0;
}
.atlas-inspector-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.atlas-inspector-parent {
  font-size: 11.5px;
  color: #64748b;
  margin-bottom: 2px;
}
.atlas-inspector-title {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
}
.atlas-icon-close {
  padding: 4px 8px;
  font-size: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #f8fafc;
  cursor: pointer;
}
.atlas-conf-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
}
.atlas-conf-badge.ok { background: #dcfce7; color: #15803d; }
.atlas-conf-badge.warn { background: #fef3c7; color: #b45309; }
.atlas-unverified-note {
  margin: 6px 0 0 0;
  font-size: 12px;
  color: #b45309;
  background: #fffbeb;
  padding: 6px 8px;
  border-radius: 6px;
}
.atlas-sec {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid #f1f5f9;
}
.atlas-sec h4 {
  margin: 0 0 6px 0;
  font-size: 12.5px;
  color: #475569;
}
.atlas-sec p, .atlas-kv {
  margin: 0;
  font-size: 13px;
  line-height: 1.55;
  color: #1e293b;
}
.atlas-kv + .atlas-kv { margin-top: 6px; }
.atlas-watchout-box {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 8px;
  padding: 10px 12px;
}
.atlas-anchor-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.atlas-anchor-card {
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 9px 10px;
  background: #f8fafc;
}
.atlas-anchor-label {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 4px;
}
.atlas-anchor-editor code {
  display: block;
  font-size: 11.5px;
  color: #0f172a;
  word-break: break-all;
  margin-bottom: 6px;
}
.atlas-editor-btn {
  display: inline-block;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  background: #2563eb;
  color: #ffffff;
  border-radius: 6px;
  text-decoration: none;
}
.atlas-editor-hint {
  margin-top: 5px;
  font-size: 11px;
  color: #64748b;
}
.atlas-anchor-snippet pre {
  margin: 4px 0 6px 0;
  padding: 8px;
  background: #0f172a;
  color: #f8fafc;
  border-radius: 6px;
  font-size: 11.5px;
  overflow-x: auto;
  white-space: pre-wrap;
}
.atlas-ext-link {
  font-size: 12px;
  color: #2563eb;
  word-break: break-all;
}
.atlas-source-cite {
  font-size: 12px;
  color: #334155;
}
.atlas-open-dive-btn {
  width: 100%;
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 700;
  color: #1d4ed8;
  background: #eff6ff;
  border: 1.5px solid #93c5fd;
  border-radius: 8px;
  cursor: pointer;
}
.atlas-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 24px;
}
.atlas-modal {
  width: 680px;
  max-width: 92vw;
  max-height: 84vh;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.atlas-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 16px 20px;
  border-bottom: 1px solid #e2e8f0;
}
.atlas-modal-kicker {
  font-size: 11.5px;
  font-weight: 700;
  color: #2563eb;
  margin-bottom: 2px;
}
.atlas-modal-title {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
}
.atlas-modal-tabs {
  display: flex;
  gap: 8px;
  padding: 10px 20px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
}
.atlas-tab-btn {
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 7px;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #475569;
  cursor: pointer;
}
.atlas-tab-btn.active {
  background: #1d4ed8;
  border-color: #1d4ed8;
  color: #ffffff;
}
.atlas-modal-body {
  padding: 16px 20px;
  overflow-y: auto;
}
.atlas-prompt-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.atlas-prompt-card {
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  padding: 12px 14px;
  background: #f8fafc;
}
.atlas-prompt-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.atlas-prompt-pre {
  margin: 0;
  padding: 10px 12px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  font-size: 12.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  color: #0f172a;
}
.atlas-copy-btn {
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid #2563eb;
  background: #2563eb;
  color: #ffffff;
  cursor: pointer;
  white-space: nowrap;
}
.atlas-copy-btn.small {
  padding: 3px 8px;
  font-size: 11px;
}
.atlas-copy-btn.copied {
  background: #16a34a;
  border-color: #16a34a;
}
.atlas-hint-p {
  margin: 0 0 10px 0;
  font-size: 12.5px;
  color: #475569;
}
</style>
