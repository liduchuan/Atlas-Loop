  position: absolute;
  top: -48px;
  left: 12px;
  z-index: 999;
  padding: 6px 12px;
  background: var(--bg-active);
  color: var(--text-inverse);
  border-radius: var(--radius-sm);
  text-decoration: none;
  font-weight: 500;
}

.atlas-skip-link:focus-visible {
  top: 12px;
}

button,
a,
input {
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}

.atlas-shell-root {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* 顶部页头 */
.atlas-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 10px 20px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.atlas-topbar-left {
  min-width: 0;
  flex: 1;
}

.atlas-top-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
  flex-wrap: wrap;
}

.atlas-parent-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  padding: 1px 8px;
  border-radius: var(--radius-sm);
  text-decoration: none;
  transition: background-color 140ms ease, border-color 140ms ease;
}

.atlas-parent-link:hover {
  background: var(--bg-hover);
  border-color: var(--border-strong);
}

.atlas-subject-badge,
.atlas-level-badge {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  padding: 1px 7px;
  border-radius: var(--radius-sm);
  font-variant-numeric: tabular-nums;
}

.atlas-title-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.atlas-main-title {

  margin: 0 0 6px 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.35;
  text-wrap: balance;
}

.atlas-subtitle {
  margin: 0 0 4px 0;
  font-size: 11.5px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.005em;
  line-height: 1.4;
  text-wrap: pretty;
  opacity: 0.85;
}

.atlas-topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.atlas-model-pill {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  padding: 4px 9px;
  border-radius: var(--radius-sm);
  font-variant-numeric: tabular-nums;
}

.atlas-scope-btn {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  padding: 4px 9px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  transition: background-color 140ms ease, border-color 140ms ease;
}

.atlas-scope-btn:hover {
  background: var(--bg-subtle);
}

/* 工具栏 */
.atlas-toolbar-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 7px 20px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.atlas-streams-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
}

.atlas-stream-pill-group {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  overflow: hidden;
}

.atlas-stream-pill-group.active {
  border-color: var(--bg-active);
}

.atlas-stream-pill {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
  line-height: 18px;
}

.atlas-stream-pill-group .atlas-stream-pill {
  border: none;
  border-radius: 0;
}

.atlas-stream-pill:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.atlas-stream-pill.active {
  background: var(--bg-active);
  color: var(--text-inverse);
  border-color: var(--bg-active);
}

/* 只有一条脉络时无需过滤：脉络名作为静态标签显示 */
.atlas-stream-pill.static,
.atlas-stream-pill.static:hover {
  background: var(--bg-surface);
  color: var(--text-primary);
  cursor: default;
}

.atlas-stream-help-btn {
  width: 24px;
  height: 26px;
  border: none;
  border-left: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 11.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color 140ms ease, color 140ms ease;
}

.atlas-stream-help-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.atlas-controls-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.atlas-search-box {
  position: relative;
}

.atlas-search-field {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 9px;
  height: 28px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-canvas);
  transition: border-color 140ms ease, background-color 140ms ease;
}

.atlas-search-field:focus-within {
  background: var(--bg-surface);
  border-color: var(--border-focus);
}

.atlas-search-icon {
  color: var(--text-muted);
  flex-shrink: 0;
}

.atlas-search-input {
  width: 210px;
  border: none;
  background: transparent;
  font-size: 12px;
  color: var(--text-primary);
  padding: 0;
}

.atlas-search-input:focus {
  outline: none;
}

.atlas-search-input::placeholder {
  color: var(--text-muted);
}

.atlas-search-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  width: 320px;
  max-height: 300px;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  z-index: 60;
  padding: 4px;
}

.atlas-search-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 8px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background-color 120ms ease;
}

.atlas-search-item:hover {
  background: var(--bg-subtle);
}

.atlas-search-item-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.atlas-search-item-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.atlas-search-empty {
  padding: 10px;
  font-size: 12px;
  color: var(--text-muted);
}

.atlas-canvas-btns {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.atlas-ctrl-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  background: var(--bg-surface);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.atlas-ctrl-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.atlas-ctrl-btn:disabled {
  opacity: 0.45;
  cursor: progress;
}

.atlas-ctrl-btn.locked,
.atlas-ctrl-btn.active {
  background: var(--bg-active);
  color: var(--text-inverse);
  border-color: var(--bg-active);
}

/* 推荐学习路径 */
.atlas-reading-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 20px;
  background: var(--bg-canvas);
  border-bottom: 1px solid var(--border-subtle);
  overflow-x: auto;
  flex-shrink: 0;
}

.atlas-reading-label {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
}

.atlas-reading-steps {
  display: flex;
  align-items: center;
  gap: 4px;
}

.atlas-step-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 500;
  padding: 2px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.atlas-step-chip:hover {
  background: var(--bg-surface);
  border-color: var(--border-subtle);
  color: var(--text-primary);
}

.atlas-step-chip.active {
  background: var(--bg-surface);
  border-color: var(--border-focus);
  color: var(--text-primary);
  font-weight: 600;
}

.atlas-step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 4px;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 10.5px;
  font-weight: 600;
}

.atlas-step-chip.active .atlas-step-num {
  background: var(--bg-active);
  color: var(--text-inverse);
}

/* 工具栏 + 画布 + 抽屉的整体区域（全屏目标） */
.atlas-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-canvas);
}

/* 工作区与画布 */
.atlas-main-workspace {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
  width: 100%;
}

.atlas-canvas-container {
  flex: 1;
  height: 100%;
  min-height: 400px;
  position: relative;
  background: var(--bg-canvas);
}

/* 节点卡片 —— 克制的建筑感风格 */
.react-flow__node-atlasNode {
  border-radius: var(--radius-lg) !important;
  box-shadow: none !important;
}

.react-flow__node-atlasNode:focus,
.react-flow__node-atlasNode:focus-visible {
  outline: none !important;
}

.react-flow__node-atlasNode:focus-visible .atlas-node {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}

.atlas-node {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 11px 13px;
  box-shadow: var(--shadow-xs);
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  transition: border-color 140ms ease, box-shadow 140ms ease;
}

.atlas-node:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}

.atlas-node-sub {
  background: var(--bg-canvas);
  border-style: dashed;
  border-color: var(--border-strong);
}

.atlas-node-selected {
  border-color: var(--border-focus) !important;
  box-shadow: 0 0 0 1px var(--border-focus), var(--shadow-sm) !important;
}

.atlas-handle {
  width: 6px !important;
  height: 6px !important;
  background: var(--border-strong) !important;
  border: 1px solid var(--bg-surface) !important;
}

.atlas-node-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

.atlas-node-badges {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  min-width: 0;
}

.atlas-role-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  padding: 1px 6px;
  border-radius: 4px;
}

.atlas-role-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.atlas-sub-pill {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg-subtle);
  color: var(--text-muted);
}

.atlas-unverified-pill {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--accent-warn-bg);
  color: var(--accent-warn-text);
  border: 1px dashed var(--accent-warn-border);
}

.atlas-help-wrap {
  position: relative;
  flex-shrink: 0;
}

.atlas-help-btn {
  position: relative;
  width: 18px;
  height: 18px;
  margin: 0;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--text-secondary);
  line-height: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color 140ms ease;
}

.atlas-help-btn::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 28px;
  height: 28px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: transparent;
  transition: background-color 140ms ease;
}

.atlas-help-btn svg {
  position: relative;
  z-index: 1;
  width: 18px;
  height: 18px;
  display: block;
}

.atlas-help-btn:hover,
.atlas-help-btn:focus-visible {
  color: var(--text-inverse);
  outline: none;
}

.atlas-help-btn:hover::before,
.atlas-help-btn:focus-visible::before {
  background: var(--bg-active);
}

.atlas-help-tooltip {
  position: absolute;
  bottom: calc(100% + 7px);
  right: 0;
  width: 224px;
  padding: 7px 9px;
  background: var(--bg-active);
  color: var(--text-inverse);
  font-size: 11px;
  line-height: 1.45;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  z-index: 100;
  pointer-events: none;
  text-wrap: pretty;
}

.atlas-node-body {
  display: block;
  width: 100%;
  padding: 0;
  margin: 0;
  text-align: left;
  color: inherit;
  min-width: 0;
}

.atlas-node-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.38;
  overflow-wrap: break-word;
  text-wrap: balance;
}

.atlas-node-summary {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: break-word;
}

.atlas-node-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 2px;
  padding-top: 6px;
  border-top: 1px solid var(--border-subtle);
}

.atlas-node-child-link {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 500;
  text-decoration: none;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.atlas-node-child-link:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.atlas-expand-btn {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.atlas-expand-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.atlas-expand-btn.active {
  background: var(--bg-active);
  border-color: var(--bg-active);
  color: var(--text-inverse);
}

.atlas-anchor-count {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* 图例 */
.atlas-legend-card {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.atlas-legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: var(--text-secondary);
}

.atlas-legend-swatch {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

/* 右侧检视抽屉 */
.atlas-inspector {
  width: 380px;
  max-width: 44vw;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-subtle);
  box-shadow: -6px 0 24px rgba(9, 9, 11, 0.07);
  padding: 16px 18px;
  flex-shrink: 0;
  position: relative;
  transform: translateX(100%);
  transition: transform 220ms cubic-bezier(0.32, 0.72, 0, 1);
}

.atlas-inspector.open {
  transform: translateX(0);
}

.atlas-inspector-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}

.atlas-inspector-head-text {
  min-width: 0;
}

.atlas-inspector-parent {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.atlas-inspector-title {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.35;
  text-wrap: balance;
  overflow-wrap: break-word;
}

.atlas-icon-close {
  padding: 4px 8px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  cursor: pointer;
  flex-shrink: 0;
  transition: background-color 140ms ease, color 140ms ease;
}

.atlas-icon-close:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.atlas-conf-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
}

.atlas-unverified-note {
  margin: 6px 0 0 0;
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-subtle);
  border-left: 2px solid var(--accent-warn-dot);
  padding: 6px 9px;
  border-radius: 0 4px 4px 0;
}

.atlas-sec {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}

.atlas-sec h4 {
  margin: 0 0 5px 0;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.01em;
}

.atlas-sec p,
.atlas-kv {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.58;
  color: var(--text-primary);
  overflow-wrap: break-word;
  text-wrap: pretty;
}

.atlas-kv+.atlas-kv {
  margin-top: 6px;
}

.atlas-watchout-box {
  background: var(--bg-canvas);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
}

.atlas-anchor-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.atlas-anchor-card {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 9px 10px;
  background: var(--bg-canvas);
  min-width: 0;
}

.atlas-anchor-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.atlas-anchor-editor code {
  display: block;
  font-size: 11.5px;
  color: var(--text-secondary);
  word-break: break-all;
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}

.atlas-editor-btn {
  display: inline-flex;
  align-items: center;
  padding: 4px 9px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--bg-active);
  color: var(--text-inverse);
  border-radius: var(--radius-sm);
  text-decoration: none;
  transition: opacity 140ms ease;
}

.atlas-editor-btn:hover {
  opacity: 0.88;
}

.atlas-editor-hint {
  margin-top: 5px;
  font-size: 11px;
  color: var(--text-muted);
}

.atlas-anchor-snippet pre {
  margin: 4px 0 6px 0;
  padding: 8px 10px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-size: 11.5px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

.atlas-ext-link {
  font-size: 12px;
  color: var(--text-primary);
  text-decoration: underline;
  text-underline-offset: 2px;
  word-break: break-all;
}

.atlas-source-cite {
  font-size: 12px;
  color: var(--text-secondary);
}

.atlas-open-dive-btn {
  width: 100%;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-subtle);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background-color 140ms ease, border-color 140ms ease;
}

.atlas-open-dive-btn:hover {
  background: var(--bg-hover);
}

/* 弹窗 */
.atlas-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(9, 9, 11, 0.36);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 24px;
}

.atlas-modal {
  width: 660px;
  max-width: 92vw;
  max-height: 82vh;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.atlas-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-subtle);
}

.atlas-modal-kicker {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.atlas-modal-title {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  text-wrap: balance;
}

.atlas-modal-tabs {
  display: flex;
  gap: 6px;
  padding: 8px 18px;
  background: var(--bg-canvas);
  border-bottom: 1px solid var(--border-subtle);
}

.atlas-tab-btn {
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.atlas-tab-btn:hover {
  color: var(--text-primary);
  background: var(--bg-subtle);
}

.atlas-tab-btn.active {
  background: var(--bg-surface);
  border-color: var(--border-strong);
  color: var(--text-primary);
  box-shadow: var(--shadow-xs);
}

.atlas-modal-body {
  padding: 16px 18px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.atlas-prompt-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.atlas-prompt-card {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  background: var(--bg-canvas);
}

.atlas-prompt-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.atlas-prompt-pre {
  margin: 0;
  padding: 10px 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-size: 12px;
  line-height: 1.58;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text-primary);
}

.atlas-copy-btn {
  padding: 4px 10px;
  font-size: 11.5px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid var(--bg-active);
  background: var(--bg-active);
  color: var(--text-inverse);
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 140ms ease, background-color 140ms ease, border-color 140ms ease;
}

.atlas-copy-btn:hover {
  opacity: 0.88;
}

.atlas-copy-btn.small {
  padding: 3px 8px;
  font-size: 11px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.atlas-copy-btn.copied {
  background: var(--accent-ok-dot);
  border-color: var(--accent-ok-dot);
  color: var(--text-inverse);
}

.atlas-hint-p {
  margin: 0 0 10px 0;
  font-size: 12px;
  color: var(--text-secondary);
}

/* 覆盖 React Flow 默认样式，保持简洁克制 */
.react-flow__edge-textbg {
  rx: 4;
  ry: 4;
}

.react-flow__minimap {
  background-color: var(--bg-surface) !important;
  border: 1px solid var(--border-subtle) !important;
  border-radius: var(--radius-md) !important;
  box-shadow: var(--shadow-xs) !important;
}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ═══════════════════════════════════════════════════════════
   手机端响应式
   ─ 平板（≤ 768px）：收缩检视抽屉、缩减留白
   ─ 手机（≤ 540px）：底部弹层、堆叠工具栏、放大触控目标
   ═══════════════════════════════════════════════════════════ */

/* ── 平板（≤ 768px） ───────────────────────────────────── */
@media (max-width: 768px) {
  .atlas-topbar {
    padding: 8px 14px;
    gap: 10px;
  }

  .atlas-toolbar-row {
    padding: 6px 14px;
  }

  .atlas-inspector {
    width: 280px;
    max-width: 46vw;
    padding: 12px 14px;
  }

  .atlas-inspector-title {
    font-size: 14px;
  }

  .atlas-modal {
    width: min(600px, 96vw);
  }
}

/* ── 手机（≤ 540px） ───────────────────────────────────── */
@media (max-width: 540px) {

  /* 顶栏：精简 */
  .atlas-topbar {
    padding: 8px 12px;
    gap: 6px;
    flex-wrap: nowrap;
  }

  .atlas-model-pill {
    display: none;
  }

  .atlas-subtitle {
    display: none;
  }

  .atlas-main-title {
    font-size: 13.5px;
    margin-bottom: 2px;
  }

  .atlas-topbar-right {
    gap: 6px;
  }

  /* 工具栏：垂直堆叠 */
  .atlas-toolbar-row {
    flex-direction: column;
    align-items: stretch;
    padding: 6px 12px;
    gap: 6px;
  }

  .atlas-streams-bar {
    width: 100%;
  }

  .atlas-controls-group {
    width: 100%;
    justify-content: space-between;
  }

  /* 搜索框：自适应宽 */
  .atlas-search-box {
    flex: 1;
  }

  .atlas-search-field {
    width: 100%;
    height: 32px;
  }

  .atlas-search-input {
    width: 100%;
    min-width: 0;
    font-size: 13px;
    /* 防止 iOS 自动缩放 */
  }

  .atlas-search-dropdown {
    width: calc(100vw - 24px);
    right: 0;
    left: auto;
  }

  /* 触控目标放大 */
  .atlas-ctrl-btn {
    width: 36px;
    height: 36px;
  }

  .atlas-stream-pill {
    padding: 5px 10px;
    min-height: 32px;
  }

  .atlas-step-chip {
    padding: 5px 8px;
    min-height: 32px;
  }

  .atlas-scope-btn {
    padding: 6px 10px;
    min-height: 32px;
  }

  /* 推荐路径：紧凑 */
  .atlas-reading-bar {
    padding: 5px 12px;
    -webkit-overflow-scrolling: touch;
  }

  /* 检视抽屉 → 底部弹层 */
  .atlas-inspector {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100% !important;
    max-width: 100% !important;
    max-height: 65vh;
    border-left: none;
    border-top: 1px solid var(--border-subtle);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 24px rgba(9, 9, 11, 0.12);
    z-index: 50;
    padding: 8px 16px 16px;
    -webkit-overflow-scrolling: touch;
    /* 底部弹层纵向滑入滑出 */
    transform: translateY(100%);
  }

  .atlas-inspector.open {
    transform: translateY(0);
  }

  /* 底部拖拽把手 */
  .atlas-inspector::before {
    content: '';
    display: block;
    width: 36px;
    height: 4px;
    background: var(--border-strong);
    border-radius: 2px;
    margin: 0 auto 10px;
  }

  /* 图例：手机隐藏（画布太小） */
  .atlas-legend-card {
    display: none;
  }

  /* 弹窗 → 底部弹层 */
  .atlas-modal-backdrop {
    align-items: flex-end;
    padding: 0;
  }

  .atlas-modal {
    width: 100%;
    max-width: 100%;
    max-height: 88vh;
    border-radius: 12px 12px 0 0;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
  }

  .atlas-modal-header {
    padding: 12px 14px;
  }

  .atlas-modal-title {
    font-size: 14px;
  }

  .atlas-modal-tabs {
    padding: 6px 14px;
  }

  .atlas-modal-body {
    padding: 12px 14px;
    -webkit-overflow-scrolling: touch;
  }

  /* 提示卡片内边距 */
  .atlas-prompt-card {
    padding: 10px 11px;
  }

  .atlas-prompt-pre {
    font-size: 11.5px;
  }
}
